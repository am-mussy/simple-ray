name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: false

      - name: Check shell scripts
        run: |
          bash -n scripts/install.sh scripts/install_test.sh
          shellcheck scripts/install.sh scripts/install_test.sh

      - name: Test bootstrap
        run: bash scripts/install_test.sh

      - name: Test Go packages
        run: go test ./...

      - name: Vet Go packages
        run: go vet ./...

      - name: Cross-build supported targets
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" CGO_ENABLED=0 go build -trimpath -o "/tmp/vpnctl-linux-${arch}" ./cmd/vpnctl
          done
